version: 2
models:
  - name: landing_allergy_intolerance
    description: Landing cache for ALLERGY_INTOLERANCE, scoped to NCL practices.

  - name: landing_appointment
    description: Landing cache for APPOINTMENT, scoped to NCL practices.
    tests:
      - min_row_count:
          arguments:
            min_rows: 80000000
          config:
            severity: error
      - elementary.volume_anomalies:
          arguments:
            anomaly_direction: drop
          config:
            severity: warn
      - elementary.dimension_anomalies:
          arguments:
            dimensions:
              - publisher_organisation_code
          config:
            severity: warn

  - name: landing_appointment_practitioner
    description: Landing cache for APPOINTMENT_PRACTITIONER, scoped to NCL practices.

  - name: landing_concept
