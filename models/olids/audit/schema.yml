version: 2

models:
  - name: audit_patient_linkage
    description: >-
      Patient linkage metrics. One row per table_name, metric_name, practice_code and value_text.
      Warns above 10,000 unlinked live patients or 15,000 null keys. Both sit at zero since
      patient_person began building from the patient spine, so the bands catch a regression.
      sk ownership bands sit above the August 2026 baseline (367 contested, 42 ambiguous,
      1,908 no-owner rows; 602 persons nulled) to flag growth in shared keys.

    tests:
      - audit_metric_within_band:
          arguments:
            metric: unlinked_live_patients
            max_value: 10000
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: unlinked_live_null_sk
            max_value: 15000
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: sk_contested_rows
            max_value: 1000
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: sk_ambiguous_owner_rows
            max_value: 200
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: sk_no_owner_rows
            max_value: 5000
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: sk_nulled_persons
            max_value: 1500
          config:
            severity: warn

  - name: audit_observation
    description: >-
      Observation metrics. One row per table_name, metric_name, practice_code and value_text.
      Warns above 100 retained person orphans. The 99% precision warning signals that
      real bands must be added when the upstream vocabulary fix lands.

    tests:
      - audit_metric_within_band:
          arguments:
            metric: person_orphan_no_patient_row
            max_value: 100
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: clinical_effective_date_precision_source_concept_id_unmapped_pct
            min_value: 99
          config:
            severity: warn

  - name: audit_medication_order
    description: >-
      Medication order metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_medication_statement
    description: >-
      Medication statement metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_encounter
    description: >-
      Encounter metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_appointment
    description: >-
      Appointment metrics. One row per table_name, metric_name, practice_code and value_text.
      Warns above 2,500,000 patient orphan rows.

    tests:
      - audit_metric_within_band:
          arguments:
            metric: patient_orphan_rows
            max_value: 30000000
          config:
            severity: warn

  - name: audit_episode_of_care
    description: >-
      Episode of care metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_referral_request
    description: >-
      Referral request metrics. One row per table_name, metric_name, practice_code and value_text.
      Warns above 100,000 duplicate id rows. The feed no longer ships duplicate referral ids,
      so the band catches a regression rather than tracking a known fault.

    tests:
      - audit_metric_within_band:
          arguments:
            metric: duplicate_id_rows
            max_value: 100000
          config:
            severity: warn

  - name: audit_allergy_intolerance
    description: >-
      Allergy intolerance metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_diagnostic_order
    description: >-
      Diagnostic order metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_procedure_request
    description: >-
      Procedure request metrics. One row per table_name, metric_name, practice_code and value_text.
      No warn threshold is set.

  - name: audit_staleness
    description: >-
      Domain staleness metrics. One row per table_name, metric_name, practice_code and value_text.
      Warns above thirty practices lagging the domain consensus by seven days. Consensus is the
      median of per-practice max activity dates; rows dated after their own source_extraction_date
      are excluded, so future-dated source rows cannot distort it. No CURRENT_DATE is used.

    tests:
      - audit_metric_within_band:
          arguments:
            metric: practices_lagging_consensus_7d
            table_name: OBSERVATION
            max_value: 30
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: practices_lagging_consensus_7d
            table_name: MEDICATION_ORDER
            max_value: 30
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            metric: practices_lagging_consensus_7d
            table_name: EPISODE_OF_CARE
            max_value: 30
          config:
            severity: warn

  - name: audit_gp2gp
    description: >-
      Inferred GP2GP copy and import counts and percentages of all non-deleted rows
      in each NCL EMIS conformed table, including rows without a person or date in
      the denominator. One row per table_name and metric_name; practice_code,
      value_text and value_date are null. Order exceptions count positive durations
      other than 28 and non-zero costs on inferred imports; these values are retained.
      Import counts cover all persons, including those with one patient record.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [table_name, metric_name]
      - audit_metric_within_band:
          arguments:
            table_name: MEDICATION_ORDER
            metric: gp2gp_copy_pct
            min_value: 4
            max_value: 14
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            table_name: MEDICATION_STATEMENT
            metric: gp2gp_copy_pct
            min_value: 4
            max_value: 14
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            table_name: OBSERVATION
            metric: gp2gp_copy_pct
            min_value: 3
            max_value: 10
          config:
            severity: warn
      - audit_metric_within_band:
          arguments:
            table_name: MEDICATION_ORDER
            metric: gp2gp_import_pct
            min_value: 10
            max_value: 30
          config:
            severity: warn

unit_tests:
  - name: gp2gp_audit_live_denominators_flags_and_exceptions
    description: Synthetic live and deleted rows test all 17 metrics, including unlinked undated rows in the live denominator.
    model: audit_gp2gp
    given:
      - input: ref('conformed_medication_order')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::NUMBER AS person_id,
            column3::DATE AS clinical_effective_date,
            column4::NUMBER AS duration_days,
            column5::NUMBER AS estimated_cost,
            column6::BOOLEAN AS lds_is_deleted
          FROM VALUES
            ('00000000-0000-0000-0000-000000000191', -18413, '2020-01-01', 56, 5, FALSE),
            ('00000000-0000-0000-0000-000000000192', NULL, NULL, 28, 0, FALSE),
            ('00000000-0000-0000-0000-000000000193', -18414, '2020-01-01', 56, 5, TRUE)
      - input: ref('int_medication_order_gp2gp_flags')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::BOOLEAN AS is_gp2gp_copy,
            column3::BOOLEAN AS is_gp2gp_import
          FROM VALUES
            ('00000000-0000-0000-0000-000000000191', TRUE, TRUE),
            ('00000000-0000-0000-0000-000000000193', TRUE, TRUE)
      - input: ref('conformed_medication_statement')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::BOOLEAN AS lds_is_deleted
          FROM VALUES
            ('00000000-0000-0000-0000-000000000194', FALSE)
      - input: ref('int_medication_statement_gp2gp_flags')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::BOOLEAN AS is_gp2gp_copy,
            column3::BOOLEAN AS is_gp2gp_import
          FROM VALUES
            ('00000000-0000-0000-0000-000000000194', FALSE, FALSE)
      - input: ref('conformed_observation')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::BOOLEAN AS lds_is_deleted
          FROM VALUES
            ('00000000-0000-0000-0000-000000000194', FALSE)
      - input: ref('int_observation_gp2gp_flags')
        format: sql
        rows: |
          SELECT
            column1::VARCHAR AS id,
            column2::BOOLEAN AS is_gp2gp_copy,
            column3::BOOLEAN AS is_gp2gp_import
          FROM VALUES
            ('00000000-0000-0000-0000-000000000194', FALSE, FALSE)
    expect:
      rows:
        - {table_name: MEDICATION_ORDER, metric_name: live_rows, value_number: 2, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: gp2gp_copy_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: gp2gp_copy_pct, value_number: 50, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: gp2gp_import_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: gp2gp_import_pct, value_number: 50, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: import_non_default_duration_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_ORDER, metric_name: import_non_default_cost_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_STATEMENT, metric_name: live_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_STATEMENT, metric_name: gp2gp_copy_rows, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_STATEMENT, metric_name: gp2gp_copy_pct, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_STATEMENT, metric_name: gp2gp_import_rows, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: MEDICATION_STATEMENT, metric_name: gp2gp_import_pct, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: OBSERVATION, metric_name: live_rows, value_number: 1, practice_code: null, value_text: null, value_date: null}
        - {table_name: OBSERVATION, metric_name: gp2gp_copy_rows, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: OBSERVATION, metric_name: gp2gp_copy_pct, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: OBSERVATION, metric_name: gp2gp_import_rows, value_number: 0, practice_code: null, value_text: null, value_date: null}
        - {table_name: OBSERVATION, metric_name: gp2gp_import_pct, value_number: 0, practice_code: null, value_text: null, value_date: null}
