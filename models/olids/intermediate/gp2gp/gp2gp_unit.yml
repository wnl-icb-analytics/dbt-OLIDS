      temporary residents, missing concepts and inclusive day-zero/day-30 boundaries.
      A to B to A retains later entries on A; null values match across records;
      events on the registration day with a lag of one day are not copies.
      Each copy-window key stays independent; tied representatives use patient ID
      then event ID. Exact two-day lag qualifies without a registration.
