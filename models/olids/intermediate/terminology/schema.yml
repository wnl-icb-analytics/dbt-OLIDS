version: 2

models:
  - name: int_enriched_concept_map
    description: >-
      Join-safe analytical concept map. Grain: one row per source_concept_id.
      Active non-READ mappings are preferred; the last known analytical mapping
      is retained only when no active version exists.
    columns:
      - name: source_concept_id
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: mapping_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - active
                  - last_known
                  - backfilled
                  - legacy_only
                  - unmapped
              config:
                severity: error
