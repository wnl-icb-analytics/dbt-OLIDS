version: 2

models:
  - name: int_enriched_concept_map
    description: 'Enriched concept map. Grain: one row per source_concept_id. Every conformed and audit join relies on this grain; a duplicate fans out clinical rows silently, so the tests are error severity.'
    columns:
      - name: source_concept_id
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
