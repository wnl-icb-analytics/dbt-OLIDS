  - name: stable_observation
    description: >-
      Published observations, recorded allergies and referral requests, one row per
      source entity and source ID. Native observation IDs are unchanged; added
      entities use deterministic UUIDs. Use source_entity and source_record_id to
      join the original entity table. Counts are source records, not deduplicated
      clinical actions. is_gp2gp_copy marks inferred transferred copies within the
      same source entity; mutable problem status and episodicity may differ from the
      representative. Copy filtering keeps the state of the representative. Allergy clinical
      and verification status are unavailable.
      Missing fields retain nulls, including measurement fields on added records.
      The population follows conformed patient filtering and current NCL practices.
      Source entities identify delivery tables; clinical meaning follows the recorded code.

    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: clinical_system
      - name: source_entity
        description: Source entity, observation, allergy_intolerance or referral_request. Counts are source records, not deduplicated clinical actions.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['observation', 'allergy_intolerance', 'referral_request']
      - name: source_record_id
        description: Original UUID in the source entity table. Join with source_entity; added observation IDs use an entity-qualified UUID. Native observation IDs are unchanged.
        tests:
          - not_null
      - name: allergy_medication_name
        description: Supplied medication name on an allergy record. This records allergy evidence; the feed does not populate clinical or verification status.
      - name: is_gp2gp_copy
        description: >-
          Inferred transfer copy on another patient record with the same person, mapped
          concept, clinical date and value. The representative has a strictly earlier
          non-null recorded timestamp. Ties and missing timestamps are not copies.
          A copy was entered more than one day after the event, or the event predates
          its latest Regular registration start on or before recording. Same-record
          repeats are retained. Coverage is the NCL EMIS feed. Flags can change when
          originals leave retention or registrations are rewritten.
      - name: gp2gp_original_id
        description: >-
          ID of the first-recorded representative chosen at build time, ordered by
          recorded timestamp, patient ID and ID. Null for non-copies. Several copies
          may share a representative. This is inferred provenance, not a stable join
          key; it can change as records leave retention or registrations are rewritten.
      - name: is_gp2gp_import
        description: >-
          Inferred imported history, including rows without a retained original.
          The event predates the latest non-deleted Regular registration start on
          this patient record on or before recording, and recording is within 30 days
          of that start, inclusive. False without a person, clinical date or matching
          registration, or on a deleted row. Episode ends do not constrain this
          heuristic. Re-registration and rewritten starts can change the flag.
          This flag is a timing signature, and a small share may be entries made by
          the practice itself, such as new-patient intake checks dated just before registration
          or entries on records re-registered at the same practice.
  - name: stable_organisation
    description: Stable organisation table.
    columns:
      - name: id
        tests:
          - unique
          - not_null
  - name: stable_patient
    description: >-
      Stable patient table. One row per registration record.


      Join contract: person_id within OLIDS; sk_patient_id to commissioning datasets
      (SUS, MHSDS, CSDS). sk_patient_id resolves to one live person; it is NULL where
      the PDS trace shows another person owns the key (see sk_linkage_status).
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: sk_patient_id
        description: Pseudonymised NHS number key; NULL when sk_linkage_status is contested, ambiguous_owner or no_owner.
      - name: pds_trace_status
        description: PDS trace outcome for the row (confirmed, contradicted, untraced incl. sentinel trace failures, no_person_row).
      - name: sk_linkage_status
        description: Ownership of the submitted sk (sole, pds_owner, contested, ambiguous_owner, no_owner).
      - name: clinical_system
        description: 'Clinical system that recorded the row, cascaded from the patient record (EMIS or SystmOne).'
  - name: stable_patient_address
    description: Stable patient_address table.
