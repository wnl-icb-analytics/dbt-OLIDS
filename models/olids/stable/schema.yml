  - name: stable_postcode_hash
    description: >-
      Stable postcode geography lookup. The source masking policy currently
      returns the same 64-character masked value in postcode and postcode_hash;
      neither column contains a raw postcode.
    columns:
      - name: postcode
        description: Masked postcode value; currently identical to postcode_hash.
      - name: postcode_hash
        description: Masked 64-character postcode hash.
        tests:
          - unique
          - not_null
