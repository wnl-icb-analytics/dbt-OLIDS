version: 2
models:
  - name: conformed_appointment_booking
    description: >-
      One current recorded booking per retained patient-associated appointment
      with a booking timestamp and person ID. Inherits the filtered NCL patient
      spine and all appointment statuses, contexts and patient-associated blocked
      slots. Excludes deleted records. This is the booking still recorded on the
      current appointment, not a full history of rebookings or cancellations.
    columns:
      - name: appointment_id
        description: Current appointment ID, not a separate historical booking identifier.
      - name: patient_id
        description: Practice-level patient ID on the current appointment.
      - name: person_id
        description: Consistent person ID across practice registrations.
      - name: datetime_booked
        description: Recorded booking timestamp. Can follow start_date after retrospective entry.
      - name: start_date
        description: Current scheduled appointment timestamp, which can change after rebooking.
      - name: booking_method_source_code
        description: Source booking method code from the conformed concept lookup.
      - name: booking_method_source_display
        description: Label for the source booking method.
      - name: booking_method_code
        description: Mapped booking method code from the conformed concept lookup.
      - name: booking_method_display
        description: Label for the mapped booking method.
      - name: provider_organisation_id
        description: Current appointment provider, not necessarily the booking organisation.
      - name: publisher_organisation_id
        description: Data publisher organisation ID.
      - name: publisher_organisation_code
        description: Publisher practice ODS code supplied on the appointment.
      - name: source_extraction_date
        description: Source snapshot extraction timestamp.
