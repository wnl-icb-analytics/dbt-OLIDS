    description: 'Filtered Allergy Intolerance conformed view.


      Applied filters:

      - Patient filtering: Excludes sensitive patients (is_spine_sensitive=FALSE, is_confidential=FALSE, is_test_patient=FALSE)

      - Practice filtering: Restricts to WNL practices only

      - Data integrity: Inner joins ensure only records with valid patient and organisation references


      Filtering method: Inner join to conformed_patient and int_wnl_practices'
    columns:
      - name: id
        tests:
          - column_completeness:
              arguments:
                tolerance_percent: 1.0
      - name: patient_id
        tests:
          - column_completeness:
              arguments:
                tolerance_percent: 1.0
          - referential_integrity:
              arguments:
                to: ref('conformed_patient')
                field: id
                tolerance_percent: 1.0
      - name: person_id
        tests:
          - column_completeness:
              arguments:
                tolerance_percent: 1.0
