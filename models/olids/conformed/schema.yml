                to: ref('conformed_practitioner')
                field: id
                tolerance_percent: 1.0
      - name: encounter_id
        tests:
          - referential_integrity:
              arguments:
                to: ref('conformed_encounter')
                field: id
                tolerance_percent: 1.0
      - name: clinical_effective_date
