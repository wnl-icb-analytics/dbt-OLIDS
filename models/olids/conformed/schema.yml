  - name: conformed_organisation
    description: 'Unfiltered Organisation reference view.


      No filters applied - reference data used as-is.

      Direct passthrough from source table with explicit column selection for interface consistency.'
    columns:
      - name: id
  - name: conformed_patient
    description: "Filtered patient conformed view. Foundation for all patient-related filtering.\n\nExcludes sensitive patients:\n- is_spine_sensitive = FALSE (excludes spine-sensitive patients)\n- is_confidential = FALSE (excludes confidential patients) \n- is_test_patient = FALSE (excludes test patients)\n\nRestricts to WNL practices:\n- publisher_organisation_code IN (WNL practice codes via int_wnl_practices)"
    tests:
      - null_count_below:
          arguments:
            column_name: person_id
            max_nulls: 500
          config:
            severity: error
    columns:
      - name: sk_patient_id
        tests:
          - not_null:
              config:
                severity: error
      - name: id
      - name: lds_source_record_id
      - name: gender_source_concept_id
      - name: registered_practice_organisation_id
