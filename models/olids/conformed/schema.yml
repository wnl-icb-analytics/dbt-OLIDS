  - name: conformed_patient
    description: "Filtered patient conformed view. Foundation for all patient-related filtering.\n\nExcludes sensitive patients:\n- is_spine_sensitive = FALSE (excludes spine-sensitive patients)\n- is_confidential = FALSE (excludes confidential patients) \n- is_test_patient = FALSE (excludes test patients)\n\nRestricts to NCL practices:\n- publisher_organisation_code IN (NCL practice codes via int_ncl_practices)"
    tests:
      - null_count_below:
          arguments:
            column_name: person_id
            max_nulls: 5000
          config:
            severity: error
    columns:
      - name: sk_patient_id
        tests:
          - not_null:
              config:
                severity: error
      - name: id
      - name: lds_source_record_id
      - name: person_uuid
        description: Source person UUID from PATIENT.person_id
      - name: gender_source_concept_id
      - name: registered_practice_organisation_id
      - name: clinical_system
  - name: conformed_patient_address
