  - name: conformed_episode_of_care
    description: 'Filtered Episode Of Care conformed view.


      Applied filters:

      - Patient filtering: Excludes sensitive patients (is_spine_sensitive=FALSE, is_confidential=FALSE, is_test_patient=FALSE)

      - Practice filtering: Restricts to NCL practices only

      - Data integrity: Inner joins ensure only records with valid patient and organisation references


      Filtering method: Inner join to conformed_patient and int_ncl_practices'

    tests:
      # the enriched map local backfill covers Deceased, resolved by (system, code)
      # because feed concept UUIDs rotate between loads
      - audit_gate:
          arguments:
            audit_model: audit_episode_of_care
            metric: episode_status_source_concept_id_unmapped_pct
            max_value: 0
          config:
            severity: error
    columns:
      - name: id
      - name: patient_id
      - name: person_id
      - name: publisher_organisation_id
      - name: managing_organisation_id
      - name: usual_gp_practitioner_in_role_id
      - name: episode_of_care_start_date
      - name: episode_type_source_concept_id
      - name: episode_status_source_concept_id
      - name: clinical_system
  - name: conformed_location
