models:
  - name: synapse_base_olids_allergy_intolerance
    description: 'Filtered Allergy Intolerance base view.


      Applied filters:

      - Patient filtering: Excludes sensitive patients (is_spine_sensitive=FALSE, is_confidential=FALSE, is_test_patient=FALSE)

      - Practice filtering: Restricts to WNL practices only

      - Data integrity: Inner joins ensure only records with valid patient and organisation references


      Filtering method: Inner join to synapse_base_olids_patient and synapse_int_wnl_practices'
    columns:
      - name: id
      - name: patient_id
      - name: person_id
      - name: practitioner_id
      - name: encounter_id
      - name: lds_start_datetime
      - name: clinical_effective_date
