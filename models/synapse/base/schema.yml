  - name: synapse_base_olids_patient
    description: "Base filtered patient view. Foundation for all patient-related filtering.\n\nExcludes sensitive patients:\n- is_spine_sensitive = FALSE (excludes spine-sensitive patients)\n- is_confidential = FALSE (excludes confidential patients) \n- is_test_patient = FALSE (excludes test patients)\n\nRestricts to WNL practices:\n- publisher_organisation_code IN (WNL practice codes via synapse_int_wnl_practices)"
    columns:
      - name: sk_patient_id
      - name: id
      - name: lds_source_record_id
      - name: gender_source_concept_id
      - name: registered_practice_organisation_id
