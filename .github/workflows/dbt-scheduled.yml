# Started by workflow_dispatch only. Snowflake task TASK_DISPATCH_DBT_OLIDS_DAILY
# (Snowflake-Deployment: dbt Admin/dbt GitHub Actions Runs/dbt workflow
# dispatch.sql) dispatches it at 04:00 Europe/London with scheduled=true;
# GitHub cron started runs hours late. OLIDS snapshots finish by about 02:20
# London; dbt-analytics follows at 06:00.

name: dbt OLIDS Scheduled Run

run-name: dbt OLIDS daily

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run dbt even when the last successful watermark matches
        type: boolean
        default: false
      scheduled:
        description: Apply scheduled-run rules (wait for a new snapshot, report failures)
        type: boolean
        default: false

jobs:
  run:
    name: Scheduled dbt-olids run
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: dbt-olids-prod
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE__USERNAME }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE__PASSPHRASE }}
      SNOWFLAKE_ROLE: DBT_ADMIN
      SNOWFLAKE_WAREHOUSE: WH_WNL_OLIDS_L
      SNOWFLAKE_TARGET_DATABASE: OLIDS_ENGINEERING
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        with:
          version: "0.6.x"

      - name: Install check dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python pyyaml snowflake-connector-python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE__PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/rsa_key.p8" >> "$GITHUB_ENV"

      - name: Check source schema contract
        run: python scripts/checks/compare_sources_to_information_schema.py --report-json target/source_schema_report.json

      - name: Report undeclared source tables
        if: ${{ !cancelled() && hashFiles('target/source_schema_report.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/report_undeclared_source_tables.py target/source_schema_report.json

      - name: Wait for a new source snapshot
        id: watermark
        env:
          SCHEDULED: ${{ inputs.scheduled }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          # Reconcile these outputs monthly even when the source snapshot is unchanged.
          if [ "$(date -u +%d)" = "01" ]; then args+=(--force); fi
          if [ "$SCHEDULED" = "true" ]; then
            args+=(--timeout-seconds 900 --poll-seconds 300)
            if [ "$(date -u +%d)" != "01" ]; then args+=(--wait-for-advance); fi
          fi
          if [ "$FORCE_BUILD" = "true" ]; then args+=(--force); fi
          python scripts/checks/check_source_watermarks.py "${args[@]}"

      - name: Install dbt Fusion
        if: steps.watermark.outputs.should_run == 'true'
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --target x86_64-unknown-linux-gnu --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dbt" --version

      - name: Install dbt packages
        if: steps.watermark.outputs.should_run == 'true'
        run: |
          cp profiles.yml.template profiles.yml
          dbt deps

      - name: Build OLIDS
        id: build
        if: steps.watermark.outputs.should_run == 'true'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            # Keep pseudonymisation indexes out of the full refresh.
            dbt build --exclude tag:synapse stable_healthcare_event stable_clinical_record --target stable --profiles-dir .
            dbt build --select stable_healthcare_event stable_clinical_record --full-refresh --target stable --profiles-dir .
          else
            dbt build --exclude tag:synapse --target stable --profiles-dir .
          fi

      - name: Publish data lake views
        id: publish
        if: steps.watermark.outputs.should_run == 'true'
        env:
          SNOWFLAKE_ROLE: DATA_PLATFORM_MANAGER
          SNOWFLAKE_WAREHOUSE: WH_NCL_ENGINEERING_XS
        run: python scripts/checks/deploy_data_lake_views.py

      - name: Verify and record successful build
        id: verify
        if: steps.watermark.outputs.should_run == 'true'
        run: python scripts/checks/check_source_watermarks.py --verify --record-success

      - name: Record failed audit attempt
        if: ${{ !cancelled() && failure() && steps.watermark.outputs.should_run == 'true' && steps.build.outcome != 'skipped' }}
        env:
          DBT_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python scripts/checks/record_failed_audit_history.py \
            --dbt-build-outcome "$DBT_BUILD_OUTCOME" \
            --publish-outcome "$PUBLISH_OUTCOME" \
            --verify-outcome "$VERIFY_OUTCOME"

      - name: Report or resolve failure issue
        if: ${{ !cancelled() && inputs.scheduled }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_LABEL: dbt-scheduled-run-failure
        run: python .github/scripts/report_scheduled_failure.py

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.snowflake/rsa_key.p8 profiles.yml
